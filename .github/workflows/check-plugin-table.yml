name: Check plugin table

# The table only depends on the plugin code layout and the README, not on the
# state files the fleet commits every few seconds, so only run when those change.
on:
  push:
    paths: ["README.md", "tools/**", "requirements.txt", "harness/**", "*/*.py", ".github/workflows/check-plugin-table.yml"]
  pull_request:
    paths: ["README.md", "tools/**", "requirements.txt", "harness/**", "*/*.py", ".github/workflows/check-plugin-table.yml"]

jobs:
  check-plugin-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --retries 5 -r requirements.txt
      - name: Check README plugin table is up to date
        run: python3 tools/generate_plugin_table.py --check
